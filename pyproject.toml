[project]
name = "har-flow-reproducer"
version = "0.1.0"
description = "HAR Parser Module for splitting HAR files into request/response pairs"
dependencies = [
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "pytest-httpx>=0.20.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
